name: Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos-console:
    name: macOS / Console (universal)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TERM: dumb
    steps:
      - name: Check out source
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: pip3 install pyyaml --break-system-packages --user

      - name: Build Console app
        shell: bash
        working-directory: crawl-ref/source
        run: |
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 3)
          make -j"$jobs" mac-app-console-universal

      - name: Check Console app
        shell: bash
        run: |
          archive=$(find crawl-ref/source/mac-app-zips \
            -maxdepth 1 -name '*-console-macosx-universal.zip' -print -quit)
          test -n "$archive"
          ditto -x -k "$archive" "$RUNNER_TEMP/console-app"

          app=$(find "$RUNNER_TEMP/console-app" \
            -maxdepth 1 -name '*.app' -print -quit)
          executable="$app/Contents/Resources/crawl"
          test -x "$executable"

          architectures=$(lipo -archs "$executable")
          echo "architectures: $architectures"
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]
          "$executable" --version

      - name: Upload Console artifact
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-console
          path: crawl-ref/source/mac-app-zips/*-console-macosx-universal.zip
          if-no-files-found: error
