name: Translation review

on:
  push:
    branches:
      - develop
    paths:
      - .agents/skills/translation-review-repair/**
      - .github/workflows/translation-review.yml
      - crawl-ref/source/dat/descript/**
      - crawl-ref/source/dat/database/**
      - crawl-ref/source/*.cc
      - crawl-ref/source/*.h
      - crawl-ref/source/catch2-tests/test_message-translation.cc
      - crawl-ref/source/dat/**/*.lua
      - crawl-ref/source/util/translation_review.py
      - crawl-ref/source/util/code_message_review.py
      - crawl-ref/source/util/tests/*_review.py
      - translation-review/**
  pull_request:
    branches:
      - develop
    paths:
      - .agents/skills/translation-review-repair/**
      - .github/workflows/translation-review.yml
      - crawl-ref/source/dat/descript/**
      - crawl-ref/source/dat/database/**
      - crawl-ref/source/*.cc
      - crawl-ref/source/*.h
      - crawl-ref/source/catch2-tests/test_message-translation.cc
      - crawl-ref/source/dat/**/*.lua
      - crawl-ref/source/util/translation_review.py
      - crawl-ref/source/util/code_message_review.py
      - crawl-ref/source/util/tests/*_review.py
      - translation-review/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated views
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test parser and generator
        env:
          PYTHONPATH: crawl-ref/source/util
        run: >-
          python3 -m unittest discover
          -s crawl-ref/source/util/tests
          -p '*_review.py'

      - name: Verify committed review views
        run: >-
          python3 crawl-ref/source/util/translation_review.py --check

      - name: Test code message translation contracts
        run: |
          c++ -std=c++17 -I crawl-ref/source -I crawl-ref/source/catch2-tests \
            crawl-ref/source/catch2-tests/catch_amalgamated.cc \
            crawl-ref/source/catch2-tests/test_message-translation.cc \
            -o "$RUNNER_TEMP/message-translation-tests"
          "$RUNNER_TEMP/message-translation-tests" '[message-translation]'
